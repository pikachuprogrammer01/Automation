name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 单元 + 契约 + 文档漂移守卫，并卡核心模块覆盖率下限
  core:
    # 本产品只跑在 macOS（launchd / Keychain / plutil / osascript）。
    # 在 Linux 上跑等于测一套没人用的行为，所以宁可用 macOS runner。
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.11', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 故意不跑 npm install：测试必须零依赖可执行。
      # 这一步同时也是 PRD 产品原则 5「默认值要能直接活」的回归验证。
      - name: 测试 + 覆盖率门禁（行 ≥90 / 分支 ≥85）
        run: |
          set +e
          npm run test:ci > /tmp/t.log 2>&1
          code=$?
          set -e
          tail -8 /tmp/t.log
          if [ "$code" -ne 0 ]; then
            # 日志正文要登录才看得到，失败清单必须变成匿名可读的 annotation
            grep -E '^ℹ (tests|pass|fail)' /tmp/t.log | sed 's/^/::error::/'
            awk '/^✖ failing tests:/,0' /tmp/t.log | grep -oE '✖ [^\(]+' | grep -v 'failing tests' | head -12 | sed 's/^/::error::失败用例: /'
            grep -E 'AssertionError|TypeError|Error: ' /tmp/t.log | head -6 | sed 's/^/::error::/'
            exit "$code"
          fi

      - name: 发布仓洁净度 —— 追踪清单里不得出现私有层路径
        run: |
          hits=$(git ls-files | grep -iE 'loveapi|modelscope|HANDOFF|AGENT_SYSTEM_PROMPT|accounts\.json|^var/|^private/' || true)
          if [ -n "$hits" ]; then
            echo "::error::追踪清单出现私有路径"
            echo "$hits"
            exit 1
          fi

      - name: 私有层守卫必须在入库的 .gitignore 里
        run: |
          grep -qx 'private/' .gitignore
          grep -qx 'var/' .gitignore

  # 需要 @playwright/test 的两层：网络异常注入 + 录制任务被强杀后的接管。
  # core 作业不装依赖，这些用例会 skip，所以单独开一个真跑的作业。
  deps:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: manager/package-lock.json
      - run: npm ci --prefix manager
      - name: 故障注入用例（需要真 Chrome）
        run: |
          set +e
          node --test test/*.test.mjs > /tmp/t.log 2>&1
          code=$?
          set -e
          tail -8 /tmp/t.log
          if [ "$code" -ne 0 ]; then
            grep -E '^ℹ (tests|pass|fail)' /tmp/t.log | sed 's/^/::error::/'
            awk '/^✖ failing tests:/,0' /tmp/t.log | grep -oE '✖ [^\(]+' | grep -v 'failing tests' | head -12 | sed 's/^/::error::失败用例: /'
            grep -E 'AssertionError|TypeError|Error: ' /tmp/t.log | head -6 | sed 's/^/::error::/'
            exit "$code"
          fi

  # 抓「改了前端源码却忘了重新构建」——manager/public/ 是入库产物，失同步是静默的
  artifact:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            manager/web/package-lock.json
            manager/package-lock.json
      - run: npm ci --prefix manager/web
      - run: npm run build
      - name: 构建产物必须与提交的一致
        run: |
          if ! git diff --quiet --exit-code manager/public; then
            echo "::error::manager/public/ 与 manager/web/src 不同步，请把构建产物一起提交"
            git status --short manager/public
            exit 1
          fi
